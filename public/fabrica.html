<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Criativos Hotlive (HD)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
    }
    .preview-canvas {
      max-width: 100%;
      height: auto;
      aspect-ratio: 9 / 16;
      border-radius: 16px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255,255,255,0.1);
    }
    .preview-canvas.feed-aspect {
      aspect-ratio: 1 / 1;
    }
  </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col items-center">

  <header class="max-w-5xl w-full mb-8 border-b border-slate-800 pb-6">
    <div class="flex items-center gap-2">
      <span class="text-3xl">🔥</span>
      <h1 class="text-2xl md:text-3xl font-extrabold text-white tracking-tight">Gerador de Criativos HD</h1>
    </div>
    <p class="text-sm text-slate-400 mt-1">Crie criativos em alta resolução para Stories (9:16) ou Feed (1:1) com animação suave e botões interativos.</p>
  </header>

  <main class="grid grid-cols-1 lg:grid-cols-12 gap-8 max-w-6xl w-full items-start">
    <!-- Coluna de Controles -->
    <div class="lg:col-span-6 bg-slate-900/90 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-5">
      <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-4">
        <h2 class="text-base font-bold text-white uppercase tracking-wider flex items-center gap-2 text-slate-300">
          <i class="fa-solid fa-sliders text-emerald-400"></i> Configurações
        </h2>
        <div class="flex items-center gap-2">
          <button id="btnDownloadPng" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white text-xs font-semibold rounded-lg shadow flex items-center gap-1.5 transition-all cursor-pointer whitespace-nowrap">
            <i class="fa-solid fa-image text-emerald-400"></i> Baixar Img
          </button>
          
          <!-- Botão Vermelho: Baixar / Gravar Vídeo com os Textos, Botões e Áudio -->
          <div class="inline-flex items-center rounded-lg shadow shadow-red-500/20 bg-gradient-to-r from-red-600 to-rose-600 p-0.5">
            <select id="videoDurationSelect" class="bg-black/30 hover:bg-black/40 text-white text-xs font-bold rounded-l-md px-2 py-1.5 focus:outline-none border-0 cursor-pointer appearance-none text-center">
              <option value="5" selected class="bg-slate-900 text-white">5s</option>
              <option value="15" class="bg-slate-900 text-white">15s</option>
              <option value="30" class="bg-slate-900 text-white">30s</option>
            </select>
            <button id="btnRecordMp4" class="px-3 py-1.5 hover:from-red-500 hover:to-rose-500 text-white text-xs font-bold rounded-r-md flex items-center gap-1.5 transition-all cursor-pointer whitespace-nowrap border-l border-white/20" title="Baixa o vídeo com textos, botões e áudio">
              <i class="fa-solid fa-video"></i> Baixar Vídeo (<span id="btnDurationLabel">5s</span>)
            </button>
          </div>
        </div>
      </div>

      <!-- Upload de Foto ou Vídeo -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Foto ou Vídeo da Modelo</label>
        <input type="file" id="mediaInput" accept="image/*,video/mp4,video/webm,video/quicktime,video/*" class="w-full text-xs text-slate-400 file:mr-3 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-500/20 file:text-emerald-400 hover:file:bg-emerald-500/30 cursor-pointer bg-slate-950 p-2 rounded-xl border border-slate-800">
      </div>

      <!-- Formato -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Formato</label>
        <select id="formatSelect" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-emerald-500">
          <option value="story" selected>Story / Reels / TikTok (1080x1920 - 9:16)</option>
          <option value="feed">Feed / Quadrado (1080x1080 - 1:1)</option>
        </select>
      </div>

      <!-- Layout -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Estilo de Texto</label>
        <select id="layoutSelect" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-emerald-500">
          <option value="center" selected>Modelo 1: Nome no Centro</option>
          <option value="top">Modelo 2: Nome no Topo</option>
        </select>
      </div>

      <!-- Cor da Fonte -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Cor da Fonte Principal</label>
        <div class="flex items-center gap-3">
          <input type="color" id="fontColor" value="#ffffff" class="w-12 h-12 rounded cursor-pointer bg-slate-950 border border-slate-800 p-1">
          <span class="text-xs text-slate-400">Escolha a cor do nome e subtítulo</span>
        </div>
      </div>

      <!-- Nome da Modelo -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Nome da Modelo</label>
        <input type="text" id="modelName" value="Nicole" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-emerald-500">
      </div>

      <!-- Subtítulo -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Subtítulo</label>
        <input type="text" id="subtitle" value="VIP PRIVADO" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-emerald-500">
      </div>

      <!-- Texto Superior -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Texto Superior</label>
        <input type="text" id="topText" value="Chamada de vídeo recebida..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-emerald-500">
      </div>

      <!-- Pergunta CTA -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Pergunta CTA</label>
        <input type="text" id="ctaText" value="Quer atender?" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-emerald-500">
      </div>

      <!-- Posição da Foto -->
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Ajuste Vertical da Foto</label>
          <span id="posVal" class="text-xs text-slate-400">40%</span>
        </div>
        <input type="range" id="bgPosY" min="0" max="100" value="40" class="w-full accent-emerald-500">
      </div>

      <!-- Zoom Base da Foto -->
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Escala / Zoom da Foto</label>
          <span id="zoomVal" class="text-xs text-slate-400">1.0x</span>
        </div>
        <input type="range" id="bgScale" min="100" max="200" value="100" class="w-full accent-emerald-500">
      </div>

      <!-- Escurecimento / Sombra de Fundo -->
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Escurecimento / Sombra</label>
          <span id="darkenVal" class="text-xs text-slate-400">Suave (25%)</span>
        </div>
        <input type="range" id="darkenAmount" min="0" max="100" value="25" class="w-full accent-emerald-500">
      </div>

      <!-- Altura dos Botões / CTA (Distância do Rodapé) -->
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Altura dos Botões / CTA</label>
          <span id="btnOffsetVal" class="text-xs text-slate-400">Padrão (+180px)</span>
        </div>
        <input type="range" id="btnOffsetY" min="0" max="300" value="180" class="w-full accent-emerald-500">
      </div>
    </div>

    <!-- Coluna de Visualização -->
    <div class="lg:col-span-6 flex flex-col items-center">
      <div class="w-full flex items-center justify-between mb-3 px-1">
        <div class="text-xs font-medium text-slate-400 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          Pré-visualização Canvas HD
        </div>
        <!-- Botão Testar Áudio / Ouvir Vídeo -->
        <button id="btnToggleSound" class="text-xs font-semibold text-slate-300 hover:text-white bg-slate-800/80 hover:bg-slate-700 border border-slate-700 px-3 py-1 rounded-full flex items-center gap-1.5 transition-all cursor-pointer" style="display: none;">
          <i class="fa-solid fa-volume-xmark text-red-400" id="soundIcon"></i>
          <span id="soundText">Áudio Mudo</span>
        </button>
      </div>

      <!-- Canvas Real de Renderização -->
      <div class="flex justify-center w-full">
        <canvas id="mainCanvas" width="1080" height="1920" class="preview-canvas bg-black" style="max-height: 650px;"></canvas>
      </div>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');

    // Controles
    const mediaInput = document.getElementById('mediaInput');
    const formatSelect = document.getElementById('formatSelect');
    const layoutSelect = document.getElementById('layoutSelect');
    const fontColorInput = document.getElementById('fontColor');
    const modelNameInput = document.getElementById('modelName');
    const subtitleInput = document.getElementById('subtitle');
    const topTextInput = document.getElementById('topText');
    const ctaTextInput = document.getElementById('ctaText');
    const bgPosY = document.getElementById('bgPosY');
    const posVal = document.getElementById('posVal');
    const bgScale = document.getElementById('bgScale');
    const zoomVal = document.getElementById('zoomVal');
    const darkenAmount = document.getElementById('darkenAmount');
    const darkenVal = document.getElementById('darkenVal');
    const btnOffsetY = document.getElementById('btnOffsetY');
    const btnOffsetVal = document.getElementById('btnOffsetVal');
    const videoDurationSelect = document.getElementById('videoDurationSelect');
    const btnDurationLabel = document.getElementById('btnDurationLabel');
    const btnDownloadPng = document.getElementById('btnDownloadPng');
    const btnRecordMp4 = document.getElementById('btnRecordMp4');
    const btnToggleSound = document.getElementById('btnToggleSound');
    const soundIcon = document.getElementById('soundIcon');
    const soundText = document.getElementById('soundText');

    btnOffsetY.addEventListener('input', () => {
      const val = parseInt(btnOffsetY.value, 10);
      btnOffsetVal.textContent = val === 0 ? 'Original (0px)' : `Subir +${val}px`;
      render();
    });

    videoDurationSelect.addEventListener('change', () => {
      btnDurationLabel.textContent = `${videoDurationSelect.value}s`;
    });
    // Inicialização do label
    btnDurationLabel.textContent = `${videoDurationSelect.value}s`;

    // Força o tamanho inicial do canvas
    canvas.width = 1080;
    canvas.height = 1920;

    // Estado da mídia (Imagem ou Vídeo)
    let modelImg = new Image();
    modelImg.crossOrigin = "anonymous";
    let isImageLoaded = false;

    let modelVideo = document.createElement('video');
    modelVideo.crossOrigin = "anonymous";
    modelVideo.muted = false; // Não mutar o elemento nativo para permitir que o Web Audio API receba o áudio
    modelVideo.volume = 1.0;
    modelVideo.loop = true;
    modelVideo.playsInline = true;
    modelVideo.autoplay = true;
    let isVideoLoaded = false;
    let currentMediaType = null; // 'image' | 'video' | null
    let audioContext = null;
    let audioSourceNode = null;
    let audioDestNode = null;
    let monitorGainNode = null;
    let isSoundEnabled = false;

    // Alternar som da pré-visualização
    btnToggleSound.addEventListener('click', async () => {
      if (audioContext && audioContext.state === 'suspended') {
        await audioContext.resume();
      }
      isSoundEnabled = !isSoundEnabled;
      if (monitorGainNode) {
        monitorGainNode.gain.value = isSoundEnabled ? 1 : 0;
      }
      if (isSoundEnabled) {
        soundIcon.className = 'fa-solid fa-volume-high text-emerald-400';
        soundText.textContent = 'Áudio Ativo';
      } else {
        soundIcon.className = 'fa-solid fa-volume-xmark text-red-400';
        soundText.textContent = 'Áudio Mudo';
      }
    });

    // Inicializa nó de áudio persistente conectado ao vídeo
    function setupVideoAudioGraph() {
      try {
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (!audioSourceNode && audioContext) {
          audioSourceNode = audioContext.createMediaElementSource(modelVideo);
          audioDestNode = audioContext.createMediaStreamDestination();
          
          // Ganho de monitoramento (mudo na pré-visualização para não incomodar o usuário, mas gravando no stream)
          monitorGainNode = audioContext.createGain();
          monitorGainNode.gain.value = isSoundEnabled ? 1 : 0;

          audioSourceNode.connect(audioDestNode); // Envia o áudio limpo para a gravação
          audioSourceNode.connect(monitorGainNode);
          monitorGainNode.connect(audioContext.destination); // Conecta aos autofalantes
        }
      } catch (err) {
        console.warn("Setup do nó de áudio:", err);
      }
    }

    // Ícone de Telefone (Estilo WhatsApp/iOS)
    const phoneSvg = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="%23ffffff"><path d="M164.9 24.6c-7.7-18.6-28-28.5-47.4-23.2l-88 24C12.1 30.2 0 46 0 64C0 311.4 200.6 512 448 512c18 0 33.8-12.1 38.6-29.5l24-88c5.3-19.4-4.6-39.7-23.2-47.4l-96-40c-16.3-6.8-35.2-2.1-46.3 11.6L304.7 368C234.3 334.7 177.3 277.7 144 207.3L193.3 167c13.7-11.2 18.4-30 11.6-46.3l-40-96z"/></svg>';
    const phoneImg = new Image();
    phoneImg.src = phoneSvg;
    phoneImg.onload = () => render();

    // Upload de Mídia (Foto ou Vídeo MP4)
    mediaInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) {
        isImageLoaded = false;
        isVideoLoaded = false;
        currentMediaType = null;
        btnToggleSound.style.display = 'none';
        if (modelVideo.src) {
          modelVideo.pause();
          modelVideo.removeAttribute('src');
          modelVideo.load();
        }
        render();
        return;
      }

      const isVideoFile = file.type.startsWith('video/') || file.name.match(/\.(mp4|webm|mov|mkv)$/i);

      if (isVideoFile) {
        isImageLoaded = false;
        const videoUrl = URL.createObjectURL(file);
        modelVideo.src = videoUrl;
        btnToggleSound.style.display = 'inline-flex';
        modelVideo.onloadeddata = () => {
          isVideoLoaded = true;
          currentMediaType = 'video';
          setupVideoAudioGraph();
          modelVideo.play().catch(() => {});
          render();
        };
      } else {
        isVideoLoaded = false;
        btnToggleSound.style.display = 'none';
        if (modelVideo.src) {
          modelVideo.pause();
          modelVideo.removeAttribute('src');
          modelVideo.load();
        }
        const reader = new FileReader();
        reader.onload = (event) => {
          modelImg = new Image();
          modelImg.onload = () => {
            isImageLoaded = true;
            currentMediaType = 'image';
            render();
          };
          modelImg.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // Atualização de Controles
    [formatSelect, layoutSelect, fontColorInput, modelNameInput, subtitleInput, topTextInput, ctaTextInput].forEach(el => {
      el.addEventListener('input', () => render());
    });

    bgPosY.addEventListener('input', (e) => {
      posVal.textContent = e.target.value + '%';
      render();
    });

    bgScale.addEventListener('input', (e) => {
      zoomVal.textContent = (e.target.value / 100).toFixed(1) + 'x';
      render();
    });

    darkenAmount.addEventListener('input', (e) => {
      darkenVal.textContent = e.target.value === '0' ? 'Desativado (0%)' : `${e.target.value}%`;
      render();
    });

    // Função de desenho principal
    function render(zoomFactor = 1.0, pulseAnim = 0) {
      const isFeed = formatSelect.value === 'feed';
      const width = 1080;
      const height = isFeed ? 1080 : 1920;

      if (isFeed) {
        canvas.classList.add('feed-aspect');
      } else {
        canvas.classList.remove('feed-aspect');
      }

      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }

      // 1. Fundo Preto
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, width, height);

      // 2. Desenho da Mídia (Imagem ou Vídeo MP4) com Cover e Posição
      const mediaElement = currentMediaType === 'video' && isVideoLoaded && modelVideo.videoWidth > 0 
        ? modelVideo 
        : (currentMediaType === 'image' && isImageLoaded && modelImg.width > 0 ? modelImg : null);

      if (mediaElement) {
        const mediaW = currentMediaType === 'video' ? modelVideo.videoWidth : modelImg.width;
        const mediaH = currentMediaType === 'video' ? modelVideo.videoHeight : modelImg.height;

        const baseZoom = (parseFloat(bgScale.value) / 100) * zoomFactor;
        const imgAspect = mediaW / mediaH;
        const canvasAspect = width / height;

        let drawW, drawH;
        if (imgAspect > canvasAspect) {
          drawH = height * baseZoom;
          drawW = drawH * imgAspect;
        } else {
          drawW = width * baseZoom;
          drawH = drawW / imgAspect;
        }

        const offsetYPercent = parseFloat(bgPosY.value) / 100;
        const drawX = (width - drawW) / 2;
        const drawY = (height - drawH) * offsetYPercent;

        ctx.drawImage(mediaElement, drawX, drawY, drawW, drawH);
      }

      // 3. Gradientes de Contraste para Leitura
      const darkenFactor = parseFloat(darkenAmount.value) / 100;
      if (darkenFactor > 0) {
        // Gradiente Topo
        const topGrad = ctx.createLinearGradient(0, 0, 0, height * 0.35);
        topGrad.addColorStop(0, `rgba(0, 0, 0, ${0.75 * darkenFactor})`);
        topGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = topGrad;
        ctx.fillRect(0, 0, width, height * 0.35);

        // Gradiente Base
        const botGrad = ctx.createLinearGradient(0, height * 0.5, 0, height);
        botGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
        botGrad.addColorStop(0.5, `rgba(0, 0, 0, ${0.4 * darkenFactor})`);
        botGrad.addColorStop(1, `rgba(0, 0, 0, ${0.85 * darkenFactor})`);
        ctx.fillStyle = botGrad;
        ctx.fillRect(0, height * 0.5, width, height * 0.5);
      }

      // 4. Textos e Tipografia
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Sombra padrão para textos
      ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
      ctx.shadowBlur = 16;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 4;

      const isCenterLayout = layoutSelect.value === 'center';
      const name = modelNameInput.value.trim();
      const sub = subtitleInput.value.trim();
      const topT = topTextInput.value.trim();
      const ctaT = ctaTextInput.value.trim();
      const mainColor = fontColorInput.value || '#ffffff';

      if (isCenterLayout) {
        // Texto Topo
        if (topT) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
          ctx.font = '500 36px "Inter", sans-serif';
          ctx.fillText(topT, width / 2, isFeed ? 100 : 160);
        }

        // Centro: Nome e Subtítulo
        const centerY = isFeed ? (height * 0.45) : (height * 0.48);
        if (name) {
          ctx.fillStyle = mainColor;
          ctx.font = '900 86px "Montserrat", sans-serif';
          ctx.fillText(name, width / 2, sub ? centerY - 25 : centerY);
        }

        if (sub) {
          ctx.fillStyle = mainColor;
          ctx.font = '700 38px "Montserrat", sans-serif';
          ctx.letterSpacing = '4px';
          ctx.fillText(sub, width / 2, name ? centerY + 55 : centerY);
          ctx.letterSpacing = '0px';
        }
      } else {
        // Layout Topo
        if (topT) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
          ctx.font = '500 32px "Inter", sans-serif';
          ctx.fillText(topT, width / 2, isFeed ? 80 : 140);
        }

        if (name) {
          ctx.fillStyle = mainColor;
          ctx.font = '900 78px "Montserrat", sans-serif';
          ctx.fillText(name, width / 2, isFeed ? 160 : 230);
        }

        if (sub) {
          ctx.fillStyle = mainColor;
          ctx.font = '700 34px "Montserrat", sans-serif';
          ctx.letterSpacing = '4px';
          ctx.fillText(sub, width / 2, isFeed ? 220 : 300);
          ctx.letterSpacing = '0px';
        }
      }

      // 5. Seção Inferior: Pergunta e Botões
      const userOffset = parseInt(btnOffsetY?.value || 180, 10);
      const baseBtnY = isFeed ? (height - 150) : (height - 240);
      const btnY = baseBtnY - userOffset;
      const ctaY = btnY - (isFeed ? 110 : 130);

      // Pergunta (renderiza somente se não estiver vazio)
      if (ctaT) {
        ctx.fillStyle = '#ffffff';
        ctx.font = '700 42px "Inter", sans-serif';
        ctx.fillText(ctaT, width / 2, ctaY);
      }

      // Botões (Recusar e Atender)
      const btnRadius = isFeed ? 65 : 75;
      const btnLeftX = width * 0.32;
      const btnRightX = width * 0.68;

      // Animação de pulso e ondas sonares (efeito chamada chamando)
      const pulseSin = (Math.sin(pulseAnim) + 1) / 2; // 0 a 1
      const pulseSize = Math.sin(pulseAnim) * 5;

      // Ondas expansivas no botão Atender (Verde)
      for (let i = 0; i < 2; i++) {
        const ringProgress = (pulseAnim / (Math.PI * 2) + i * 0.5) % 1;
        const ringRadius = btnRadius + (ringProgress * 45);
        const ringAlpha = (1 - ringProgress) * 0.45;
        
        ctx.save();
        ctx.strokeStyle = `rgba(34, 197, 94, ${ringAlpha})`;
        ctx.lineWidth = 4 * (1 - ringProgress);
        ctx.beginPath();
        ctx.arc(btnRightX, btnY, ringRadius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // Ondas suaves no botão Recusar (Vermelho)
      for (let i = 0; i < 2; i++) {
        const ringProgress = (pulseAnim / (Math.PI * 2) + i * 0.5) % 1;
        const ringRadius = btnRadius + (ringProgress * 35);
        const ringAlpha = (1 - ringProgress) * 0.35;
        
        ctx.save();
        ctx.strokeStyle = `rgba(239, 68, 68, ${ringAlpha})`;
        ctx.lineWidth = 3 * (1 - ringProgress);
        ctx.beginPath();
        ctx.arc(btnLeftX, btnY, ringRadius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // Botão Vermelho (Recusar)
      ctx.save();
      ctx.shadowColor = 'rgba(239, 68, 68, 0.7)';
      ctx.shadowBlur = 20 + pulseSin * 20;
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.arc(btnLeftX, btnY, btnRadius + pulseSize, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Ícone Telefone Desligar
      drawPhoneIcon(ctx, btnLeftX, btnY, true, (isFeed ? 0.85 : 1.0) * (1 + pulseSize * 0.02));

      // Legenda Recusar
      ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
      ctx.shadowBlur = 10;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.font = '600 28px "Inter", sans-serif';
      ctx.fillText("Recusar", btnLeftX, btnY + btnRadius + (isFeed ? 45 : 55));

      // Botão Verde (Atender)
      ctx.save();
      ctx.shadowColor = 'rgba(34, 197, 94, 0.8)';
      ctx.shadowBlur = 25 + pulseSin * 25;
      ctx.fillStyle = '#22c55e';
      ctx.beginPath();
      ctx.arc(btnRightX, btnY, btnRadius + pulseSize * 1.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Ícone Telefone Atender
      drawPhoneIcon(ctx, btnRightX, btnY, false, (isFeed ? 0.85 : 1.0) * (1 + pulseSize * 0.03));

      // Legenda Atender
      ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
      ctx.shadowBlur = 10;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.font = '600 28px "Inter", sans-serif';
      ctx.fillText("Atender", btnRightX, btnY + btnRadius + (isFeed ? 45 : 55));
    }

    // Desenha ícone vetorial de telefone
    function drawPhoneIcon(ctx, x, y, isDecline, scale = 1.0) {
      if (!phoneImg.complete || phoneImg.width === 0) return;

      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      
      const iconSize = 64; // Tamanho do ícone

      if (isDecline) {
        // Ícone de Desligar (apontando para baixo)
        ctx.rotate(Math.PI * 0.75);
      } else {
        // Ícone de Atender (espelhado para apontar para cima/esquerda)
        ctx.scale(-1, 1);
      }

      ctx.drawImage(phoneImg, -iconSize / 2, -iconSize / 2, iconSize, iconSize);
      ctx.restore();
    }

    // Animação de pré-visualização contínua na tela
    let previewAnimationId;
    function startPreviewLoop() {
      let startTime = Date.now();
      function loop() {
        if (!btnRecordMp4.disabled) {
          const elapsed = (Date.now() - startTime) / 1000;
          const pulse = elapsed * Math.PI * 2; // pulso rítmico
          render(1.0, pulse);
        }
        previewAnimationId = requestAnimationFrame(loop);
      }
      loop();
    }

    startPreviewLoop();

    // Função para sanitizar o nome do arquivo
    function sanitizeFilename(name) {
      return name
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '') // Remove acentos
        .replace(/[^a-z0-9]/g, '-')      // Substitui caracteres não alfanuméricos por hífen
        .replace(/-+/g, '-')             // Remove hifens duplicados
        .replace(/^-|-$/g, '') || 'criativo'; // Remove hifens nas pontas ou usa fallback
    }

    // 1. Download de Imagem PNG HD
    btnDownloadPng.addEventListener('click', () => {
      render(1.0, 0);
      const link = document.createElement('a');
      const isFeed = formatSelect.value === 'feed';
      const name = sanitizeFilename(modelNameInput.value);
      link.download = `${name}-${isFeed ? 'feed-1080x1080' : 'story-1080x1920'}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // 2. Gravação do Criativo Completo (Vídeo/Foto + Textos + Botões + Áudio)
    btnRecordMp4.addEventListener('click', async () => {
      const durationSeconds = parseInt(videoDurationSelect.value, 10) || 5;
      const originalText = btnRecordMp4.innerHTML;
      btnRecordMp4.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Gravando (${durationSeconds}s)...`;
      btnRecordMp4.disabled = true;

      try {
        let mimeType = 'video/webm;codecs=vp8,opus';
        if (MediaRecorder.isTypeSupported('video/mp4;codecs=avc1,mp4a.40.2')) {
          mimeType = 'video/mp4;codecs=avc1,mp4a.40.2';
        } else if (MediaRecorder.isTypeSupported('video/mp4')) {
          mimeType = 'video/mp4';
        } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')) {
          mimeType = 'video/webm;codecs=vp9,opus';
        }

        const canvasStream = canvas.captureStream(30); // 30 FPS
        const combinedStream = new MediaStream();

        // Adiciona faixa de vídeo renderizado com textos e botões do canvas
        canvasStream.getVideoTracks().forEach(track => combinedStream.addTrack(track));

        // Se for vídeo, captura o áudio do vídeo original
        if (currentMediaType === 'video' && isVideoLoaded) {
          try {
            setupVideoAudioGraph();
            if (audioContext && audioContext.state === 'suspended') {
              await audioContext.resume();
            }

            // Tenta obter track do audioDestNode
            if (audioDestNode && audioDestNode.stream) {
              const tracks = audioDestNode.stream.getAudioTracks();
              tracks.forEach(track => combinedStream.addTrack(track));
            }

            // Fallback: se não pegou track do audioDestNode, tenta direto do video element
            if (combinedStream.getAudioTracks().length === 0 && modelVideo.captureStream) {
              const rawVidStream = modelVideo.captureStream();
              rawVidStream.getAudioTracks().forEach(t => combinedStream.addTrack(t));
            }
          } catch (audioErr) {
            console.warn("Erro ao preparar áudio:", audioErr);
          }

          // Reinicia vídeo do início durante a gravação
          modelVideo.currentTime = 0;
          try {
            await modelVideo.play();
          } catch (e) {
            console.warn("Play video err:", e);
          }
        }

        const recorder = new MediaRecorder(combinedStream, {
          mimeType,
          videoBitsPerSecond: 4000000,
          audioBitsPerSecond: 128000
        });
        const chunks = [];

        recorder.ondataavailable = (e) => {
          if (e.data.size > 0) chunks.push(e.data);
        };

        recorder.onstop = () => {
          const isFeed = formatSelect.value === 'feed';
          const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
          const name = sanitizeFilename(modelNameInput.value);
          const blob = new Blob(chunks, { type: mimeType });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.download = `${name}-criativo-${isFeed ? 'feed' : 'story'}-${durationSeconds}s.${ext}`;
          link.href = url;
          link.click();

          btnRecordMp4.innerHTML = originalText;
          btnRecordMp4.disabled = false;
          render(1.0, 0);
        };

        recorder.start();

        const startTime = Date.now();
        const duration = durationSeconds * 1000;

        function animate() {
          const elapsed = Date.now() - startTime;
          if (elapsed < duration) {
            const progress = elapsed / duration;
            // Zoom suave de 1.0 até 1.08 na modelo (somente se for imagem)
            const currentZoom = currentMediaType === 'video' ? 1.0 : (1.0 + (progress * 0.08));
            // Pulso contínuo nos botões
            const pulse = (elapsed / 1000) * (Math.PI * 1.6);

            render(currentZoom, pulse);
            requestAnimationFrame(animate);
          } else {
            if (recorder.state !== 'inactive') {
              recorder.stop();
            }
          }
        }

        animate();
      } catch (err) {
        console.error("Erro na gravação:", err);
        alert("Erro ao gravar o criativo em vídeo: " + err.message);
        btnRecordMp4.innerHTML = originalText;
        btnRecordMp4.disabled = false;
        render(1.0, 0);
      }
    });
  </script>
</body>
